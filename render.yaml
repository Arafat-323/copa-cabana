# Blueprint Render : New + > Blueprint, puis choisir le dépôt GitHub.
# Les variables "sync: false" sont demandées à la création : ne jamais les écrire ici.
services:
  - type: web
    name: copa-cabana-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL        # adresse exacte du site, sans "/" final
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: KKIAPAY_SECRET
        sync: false
      - key: KKIAPAY_SANDBOX
        value: "true"           # passer à "false" avec les clés live

  - type: web
    name: copa-cabana-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL      # ex. https://copa-cabana-api.onrender.com/api
        sync: false
      - key: VITE_KKIAPAY_PUBLIC_KEY
        sync: false
      - key: VITE_KKIAPAY_SANDBOX
        value: "true"
      - key: VITE_WHATSAPP
        value: "2290141673207"
